name: Package and CPU workflow tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -r requirements-test.txt 'build>=1.2,<2'

      - name: Run CPU unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Run CLI acceptance tests
        run: python -m unittest discover -s tests/cli -v

      - name: Build source distribution and wheel
        run: python -m build

      - name: Test wheel in a clean environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/rptu-wheel"
          "$RUNNER_TEMP/rptu-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rptu-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests/cli" -v
          "$RUNNER_TEMP/rptu-wheel/bin/rptu" doctor --json

  ml-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU model dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[ml]'
          python -m pip check
      - name: Exercise the CPU fallback and model artifacts
        run: python -m unittest discover -s tests/ml -v

  cpu-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the CPU image
        run: docker build --target cpu --tag rptu-ai-toolkit:cpu .
      - name: Exercise container mounts and the complete workflow
        run: sh scripts/container-smoke.sh rptu-ai-toolkit:cpu
